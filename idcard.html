<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRSS Niyukti Patra Form</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Devanagari',Arial,sans-serif;background:#eef0f4;color:#222}
.wrap{display:flex;flex-wrap:wrap;gap:20px;padding:20px;justify-content:center;align-items:flex-start}
.panel{background:#fff;border-radius:12px;padding:20px;width:360px;box-shadow:0 2px 10px #0002}
.panel h2{margin:0 0 12px;font-size:18px;color:#c8102e}
label{display:block;font-size:13px;margin:10px 0 3px;font-weight:600}
input,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:6px;font:inherit;font-size:14px}textarea{height:64px}
button{padding:10px 14px;border:0;border-radius:6px;background:#c8102e;color:#fff;font:inherit;font-weight:600;cursor:pointer;margin:12px 6px 0 0}
button.alt{background:#1e2a78}button:disabled{opacity:.4;cursor:not-allowed}
#msg{margin-top:10px;font-size:13px}.srch{display:flex;gap:6px;margin-bottom:10px}.srch button{margin:0}
#cv{width:100%;max-width:801px;height:auto;background:#fff;box-shadow:0 2px 10px #0003}
.pv{flex:1;min-width:300px;max-width:801px}
</style></head><body>
<div class="wrap">
<div class="panel">
<h2>पदाधिकारी की जानकारी भरें</h2>
<div class="srch"><input id="q" placeholder="Kramank ya Mobile se purana card dhundhein"><button class="alt" onclick="find()">Search</button></div>
<label>अनुशंसा करने वाले का नाम</label><input id="anushansa">
<label>नाम</label><input id="naam">
<label>पिता का नाम</label><input id="pita">
<label>पद</label><input id="pad">
<label>वैधता (Validity)</label><input id="vaidhta" placeholder="जैसे 31/12/2027">
<label>पता</label><textarea id="pata"></textarea>
<label>मोबाइल</label><input id="mobile" inputmode="numeric" maxlength="10">
<label>फोटो</label><input type="file" id="photo" accept="image/*">
<label>क्रमांक (खाली छोड़ें = अपने आप बनेगा)</label><input id="kramankIn" placeholder="जैसे HRSS/2026/0101">
<button id="save" onclick="save()">Savve & क्रमांक बनाएं</button>
<div><button id="dpng" class="alt" onclick="dl('png')" disabled>Download PNG</button><button id="dpdf" class="alt" onclick="dl('pdf')" disabled>Download PDF</button></div>
<div id="msg"></div></div>
<div class="pv"><canvas id="cv" width="801" height="1280"></canvas></div>
</div>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdj0RnK6eBEN86wjNqs8SlMR54PEMxOOrfudnG2IyJuVXXupsNyadhBHN62hLBsEBPiw/exec"; // <-- Apps Script Web App URL yahan paste karein
const TPL = "template.jpg";
const $=id=>document.getElementById(id), F=['anushansa','naam','pita','pad','vaidhta','pata','mobile'];
let photoImg=null, photoData='', kramank='', tpl=new Image(); tpl.onload=draw; tpl.src=TPL;
const msg=(t,ok)=>{$('msg').textContent=t;$('msg').style.color=ok===false?'#c00':'#080'};
const FONT='"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif';
function fit(c,t,x,y,max,px,w){let s=px;c.font=w+' '+s+'px '+FONT;while(c.measureText(t).width>max&&s>9){s--;c.font=w+' '+s+'px '+FONT}c.fillText(t,x,y)}
function wrap(c,t,max){const out=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const n=l?l+' '+w:w;if(c.measureText(n).width>max&&l){out.push(l);l=w}else l=n});out.push(l)});return out}
function draw(){
 const c=$('cv').getContext('2d');c.clearRect(0,0,801,1280);c.drawImage(tpl,0,0);c.fillStyle='#111';c.textBaseline='alphabetic';
 fit(c,$('anushansa').value,152,300,272,17,'700');
 [['naam',404],['pita',454],['pad',504],['vaidhta',554],['mobile',692]].forEach(([k,y])=>fit(c,$(k).value,220,y,392,18,'600'));
 c.font='600 17px '+FONT;const ls=wrap(c,$('pata').value,392).slice(0,3);
 ls.forEach((l,i)=>c.fillText(l,220,642-(ls.length-1-i)*26));
 if(photoImg){c.drawImage(photoImg,638,368,126,154)}
 if(kramank)fit(c,kramank,711,584,86,12,'700');
}
F.forEach(f=>$(f).addEventListener('input',()=>{lock();draw()}));
function lock(){$('dpng').disabled=$('dpdf').disabled=true;kramank=''}
if(document.fonts)document.fonts.load('600 18px "Noto Sans Devanagari"').then(draw);
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{
 const k=document.createElement('canvas');k.width=260;k.height=318;const s=Math.max(260/im.width,318/im.height);
 k.getContext('2d').drawImage(im,(260-im.width*s)/2,(318-im.height*s)/2,im.width*s,im.height*s);
 photoData=k.toDataURL('image/jpeg',.8);photoImg=new Image();photoImg.onload=draw;photoImg.src=photoData;lock()};im.src=ev.target.result};r.readAsDataURL(f)};
const jsonp=qs=>new Promise((res,rej)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');
 const t=setTimeout(()=>{cl();rej(new Error('timeout'))},25000);
 function cl(){clearTimeout(t);delete window[cb];s.remove()}
 window[cb]=d=>{cl();res(d)};s.onerror=()=>{cl();rej(new Error('script load fail'))};
 s.src=APPS_SCRIPT_URL+'?'+qs+'&callback='+cb;document.body.appendChild(s)});
async function viaFetch(d){const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});return r.json()}
async function viaBeacon(d){
 let k=d.kramank;
 if(k){const f=await jsonp('action=find&q='+encodeURIComponent(k));if(f.ok)return{ok:false,error:'duplicate'}}
 else{k=(await jsonp('action=next')).kramank}
 d.kramank=k;
 await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});
 for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,1500));const f=await jsonp('action=find&q='+encodeURIComponent(k));if(f.ok)return{ok:true,kramank:k}}
 return{ok:false,error:'save verify nahi hua (Apps Script me New version deploy kiya?)'}}
async function save(){
 for(const f of F)if(!$(f).value.trim())return msg('Sab fields bharein: '+f,false);
 if(!/^\d{10}$/.test($('mobile').value))return msg('Mobile 10 digit ka hona chahiye',false);
 if(!photoData)return msg('Photo upload karein',false);
 const d={photo:photoData,kramank:$('kramankIn').value.trim()};F.forEach(f=>d[f]=$(f).value.trim());
 $('save').disabled=true;msg('Save ho raha hai...');
 try{
  if(!APPS_SCRIPT_URL){let n=1;try{n=(+localStorage.getItem('hrss_n')||0)+1;localStorage.setItem('hrss_n',n)}catch(e){}
   kramank=d.kramank||('HRSS/'+new Date().getFullYear()+'/'+String(n).padStart(4,'0'));msg('APPS_SCRIPT_URL set nahi hai, sheet me save nahi hua.',false)}
  else{
   let j;
   try{j=await viaFetch(d)}catch(e1){if(!(e1 instanceof TypeError))throw e1;msg('Doosre tareeke se save ho raha hai...');j=await viaBeacon(d)}
   if(!j.ok){$('save').disabled=false;return msg(j.error==='duplicate'?'Ye क्रमांक pehle se use ho chuka hai, doosra daalein':'Save fail: '+(j.error||'server error'),false)}
   kramank=j.kramank;msg('Google Sheet me save ho gaya ✔',true)}
  draw();$('dpng').disabled=$('dpdf').disabled=false;
 }catch(e){msg('Save fail hua: '+((e&&e.message)||e),false)}
 $('save').disabled=false}
async function find(){
 const q=$('q').value.trim();if(!q)return;if(!APPS_SCRIPT_URL)return msg('Search ke liye APPS_SCRIPT_URL zaroori hai',false);msg('Dhundh rahe hain...');
 try{const j=await jsonp('action=find&q='+encodeURIComponent(q));if(!j.ok)return msg('Record nahi mila',false);
  F.forEach(f=>$(f).value=j[f]);kramank=j.kramank;photoData=j.photo;
  if(j.photo){photoImg=new Image();photoImg.onload=draw;photoImg.src=j.photo}else{photoImg=null}
  draw();$('dpng').disabled=$('dpdf').disabled=false;msg('Record mil gaya ✔',true)}catch(e){msg('Search fail hua: '+((e&&e.message)||e),false)}}
function dl(t){
 const cv=$('cv'),name=($('naam').value||'card')+'_'+kramank.replace(/\//g,'-');
 if(t==='png'){const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name+'.png';a.click()}
 else{const p=new window.jspdf.jsPDF('p','mm',[210,336]);p.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,210,336);p.save(name+'.pdf')}}
</script></body></html>
