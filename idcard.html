const $=id=>document.getElementById(id), F=['anushansa','naam','pita','pad','vaidhta','pata','mobile'];
let photoImg=null, photoData='', kramank='', tpl=new Image(); tpl.onload=draw; tpl.src=TPL;
const msg=(t,ok)=>{$('msg').textContent=t;$('msg').style.color=ok===false?'#c00':'#080'};
const FONT='"Noto Sans Devanagari","Mangal","Nirmala UI",Arial,sans-serif';
function fit(c,t,x,y,max,px,w){let s=px;c.font=w+' '+s+'px '+FONT;while(c.measureText(t).width>max&&s>9){s--;c.font=w+' '+s+'px '+FONT}c.fillText(t,x,y)}
function wrap(c,t,max){const out=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const n=l?l+' '+w:w;if(c.measureText(n).width>max&&l){out.push(l);l=w}else l=n});out.push(l)});return out}
function draw(){
 const c=$('cv').getContext('2d');c.clearRect(0,0,801,1280);c.drawImage(tpl,0,0);c.fillStyle='#111';c.textBaseline='alphabetic';
 fit(c,$('anushansa').value,152,300,272,17,'700');
 [['naam',404],['pita',454],['pad',504],['vaidhta',554],['mobile',692]].forEach(([k,y])=>fit(c,$(k).value,220,y,392,18,'600'));
 c.font='600 17px '+FONT;const ls=wrap(c,$('pata').value,392).slice(0,3);
 ls.forEach((l,i)=>c.fillText(l,220,642-(ls.length-1-i)*26));
 if(photoImg){c.drawImage(photoImg,638,368,126,154)}
 if(kramank)fit(c,kramank,711,584,86,12,'700');
}
F.forEach(f=>$(f).addEventListener('input',()=>{lock();draw()}));
function lock(){$('dpng').disabled=$('dpdf').disabled=true;kramank=''}
if(document.fonts)document.fonts.load('600 18px "Noto Sans Devanagari"').then(draw);
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{
 const k=document.createElement('canvas');k.width=260;k.height=318;const s=Math.max(260/im.width,318/im.height);
 k.getContext('2d').drawImage(im,(260-im.width*s)/2,(318-im.height*s)/2,im.width*s,im.height*s);
 photoData=k.toDataURL('image/jpeg',.8);photoImg=new Image();photoImg.onload=draw;photoImg.src=photoData;lock()};im.src=ev.target.result};r.readAsDataURL(f)};
async function save(){
 for(const f of F)if(!$(f).value.trim())return msg('Sab fields bharein: '+f,false);
 if(!/^\d{10}$/.test($('mobile').value))return msg('Mobile 10 digit ka hona chahiye',false);
 if(!photoData)return msg('Photo upload karein',false);
 const d={photo:photoData,kramank:$('kramankIn').value.trim()};F.forEach(f=>d[f]=$(f).value.trim());$('save').disabled=true;msg('Save ho raha hai...');
 try{
  if(APPS_SCRIPT_URL){const j=await(await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)})).json();if(!j.ok){if(j.error==='duplicate'){$('save').disabled=false;return msg('Ye क्रमांक pehle se use ho chuka hai, doosra daalein',false)}throw new Error(j.error||'server ne ok nahi diya')}kramank=j.kramank;msg('Google Sheet me save ho gaya ✔',true)}
  else{let n=1;try{n=(+localStorage.getItem('hrss_n')||0)+1;localStorage.setItem('hrss_n',n)}catch(e){}
   kramank=d.kramank||('HRSS/'+new Date().getFullYear()+'/'+String(n).padStart(4,'0'));msg('APPS_SCRIPT_URL set nahi hai, sheet me save nahi hua.',false)}
  draw();$('dpng').disabled=$('dpdf').disabled=false;
 }catch(e){msg('Save fail hua: '+((e&&e.message)||e)+' (Failed to fetch = deployment access Anyone nahi hai ya URL galat)',false)}
 $('save').disabled=false}
async function find(){
 const q=$('q').value.trim();if(!q)return;if(!APPS_SCRIPT_URL)return msg('Search ke liye APPS_SCRIPT_URL zaroori hai',false);msg('Dhundh rahe hain...');
 try{const j=await(await fetch(APPS_SCRIPT_URL+'?action=find&q='+encodeURIComponent(q))).json();if(!j.ok)return msg('Record nahi mila',false);
  F.forEach(f=>$(f).value=j[f]);kramank=j.kramank;photoData=j.photo;
  if(j.photo){photoImg=new Image();photoImg.onload=draw;photoImg.src=j.photo}else{photoImg=null}
  draw();$('dpng').disabled=$('dpdf').disabled=false;msg('Record mil gaya ✔',true)}catch(e){msg('Search fail hua',false)}}
function dl(t){
 const cv=$('cv'),name=($('naam').value||'card')+'_'+kramank.replace(/\//g,'-');
 if(t==='png'){const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name+'.png';a.click()}
 else{const p=new window.jspdf.jsPDF('p','mm',[210,336]);p.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',0,0,210,336);p.save(name+'.pdf')}}
